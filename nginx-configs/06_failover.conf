# Failover configuration - demonstrates fail_timeout and max_fails
# max_fails=2 - after 2 failed requests, mark server as down
# fail_timeout=10s - server is considered down for 10 seconds
upstream backend {
    server 127.0.0.1:5001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:5003 max_fails=2 fail_timeout=10s backup;
    server 127.0.0.1:5004 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
