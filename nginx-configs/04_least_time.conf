# Least Time - routes to the backend with lowest average response time
# Note: least_time is available in NGINX Plus only; on open-source NGINX this will fail
# For open-source, we simulate with least_conn + response time tracking
upstream backend {
    least_time header;
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
    server 127.0.0.1:5003;
    server 127.0.0.1:5004;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
